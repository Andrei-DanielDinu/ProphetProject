name: Validate Data and Build Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON Data Schemas
        run: python scripts/validate_data.py

      - name: Validate Dependency Graph DAG
        run: python scripts/validate_dependencies.py

      - name: Run Workforce and Food Model
        run: python scripts/calculate_workforce.py

      - name: Run Pytest Test Suite
        run: python -m pytest

      - name: Build MkDocs Site Strictly
        run: mkdocs build --strict
